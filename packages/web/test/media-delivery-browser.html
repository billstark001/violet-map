<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Media delivery acceptance</title>
  </head>
  <body>
    <script type="module">
      import { initializeRuntime } from '../src/runtime.ts';
      import { fetchOverlayMediaBytes } from '../src/render/overlayMedia.ts';
      await initializeRuntime({ fallbackApi: new URLSearchParams(location.search).get('api') });
      window.readPinnedMedia = async (reference) =>
        Array.from(new Uint8Array(await fetchOverlayMediaBytes(reference, new AbortController().signal)));
    </script>
