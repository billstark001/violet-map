name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm boundary:check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @violet-map/server db:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @violet-map/server test:db:artifact
      - run: pnpm --filter @violet-map/cli test:artifact
      - run: pnpm test:production
      - run: pnpm test:release
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:overlays
      - run: pnpm test:transparency
      - run: VITE_BASE_PATH=/map/ pnpm --filter @violet-map/web build
      - run: VITE_BASE_PATH=/console/ pnpm --filter @violet-map/admin build
      - run: pnpm test:frontend
      - run: pnpm test:containers
