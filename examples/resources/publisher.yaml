deployment:
  profile: public
storage:
  backends:
    resources:
      driver: s3
      bucket: violet-resources
      region: us-east-1
      accessKeyIdEnv: RESOURCE_PUBLISHER_ACCESS_KEY
      secretAccessKeyEnv: RESOURCE_PUBLISHER_SECRET_KEY
resources:
  roles: [publish]
  source:
    consistency: snapshot
  cache:
    memoryBytes: 0
    sharedBytes: 0
    local: null
    index: { driver: memory }
  work:
    workspace: null
  delivery:
    mode: server
    targetMount: { backend: resources, prefix: public }
    publicBaseUrl: https://resources.example/public/
  publication:
    storeMount: { backend: resources, prefix: control }
